worker_processes 1;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 400M;

    server {
        listen       80;
        server_name  localhost;

        # Chemin du build React
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # Second layer against XSS and clickjacking. 'unsafe-inline' is kept
        # for scripts and styles because the CRA build inlines its runtime
        # chunk and Material-UI injects styles at runtime; script-src 'self'
        # still blocks loading code from another domain.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Support React Router (SPA)
        location / {
            try_files $uri /index.html;
        }

        # Proxy vers le backend Docker
        location /api/ {
            proxy_pass http://backend:8000;  # Nom du conteneur backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;

            # Gestion des cookies
            proxy_set_header Cookie $http_cookie;
            proxy_cookie_domain backend localhost;
            proxy_cookie_path / /;

            proxy_pass_header Set-Cookie;
            proxy_pass_header Authorization;

            proxy_buffering off;
            proxy_redirect off;
        }

        # Page d'erreur
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
